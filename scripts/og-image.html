<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<!-- Sorgente di public/og.png, l'anteprima dei link (1200×630). Rigenera con: node scripts/og-image.ts
     Testo generico, senza "a brevissimo": WhatsApp e Facebook tengono l'immagine in cache per settimane. -->
<style>
  :root {
    --orange: #ea580c;
    --ink: #1d1d1f;
    --white: #ffffff;
  }
  * {
    box-sizing: border-box;
    margin: 0;
  }
  html,
  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
  }
  body {
    display: flex;
    flex-direction: column;
    padding: 52px 64px 52px;
    background: var(--orange);
    color: var(--ink);
    font-family: "Segoe UI", system-ui, sans-serif;
  }
  .black {
    font-family: "Segoe UI Black", "Segoe UI", system-ui, sans-serif;
    font-weight: 900;
  }
  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 18px;
    font-size: 46px;
    letter-spacing: 0.02em;
  }
  .brand svg {
    width: 76px;
    height: 76px;
  }
  .where {
    font-size: 27px;
    font-weight: 700;
  }
  h1 {
    margin-top: 40px;
    font-size: 86px;
    line-height: 1.02;
    letter-spacing: -0.02em;
  }
  h1 span {
    display: block;
    color: var(--white);
  }
  .sub {
    margin-top: 20px;
    font-size: 31px;
    font-weight: 600;
  }
  .bar {
    margin-top: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 26px 22px 36px;
    border-radius: 26px;
    background: var(--ink);
    color: var(--white);
  }
  .label {
    font-size: 23px;
    font-weight: 600;
  }
  .domain {
    font-size: 54px;
    line-height: 1.1;
  }
  .arrow {
    display: grid;
    place-items: center;
    width: 78px;
    height: 78px;
    border-radius: 50%;
    background: var(--white);
  }
</style>
</head>
<body>
  <div class="top">
    <div class="brand black">
      <!-- public/icon.svg con il fondo scuro, come nei post social. -->
      <svg viewBox="0 0 512 512" aria-hidden="true">
        <rect width="512" height="512" rx="112" fill="#1d1d1f"/>
        <g transform="translate(196 -36) rotate(40) scale(0.76)" fill="#fff" stroke="#1d1d1f" stroke-width="14" stroke-linejoin="round">
          <rect x="40" y="196" width="56" height="156" rx="12"/>
          <rect x="88" y="188" width="180" height="176" rx="64"/>
          <rect x="228" y="250" width="92" height="52" rx="26"/>
          <rect x="228" y="298" width="84" height="48" rx="24"/>
          <rect x="222" y="342" width="72" height="42" rx="21"/>
          <rect x="180" y="190" width="250" height="60" rx="30"/>
          <rect x="146" y="232" width="134" height="50" rx="25" transform="rotate(8 146 257)"/>
        </g>
        <path d="M382 333L448 399M448 333L382 399" stroke="#fff" stroke-width="30" stroke-linecap="round"/>
      </svg>
      QUI
    </div>
    <p class="where">Provincia di Avellino</p>
  </div>
  <h1 class="black">Dove c'è carburante,<span>adesso.</span></h1>
  <p class="sub">Le segnalazioni di chi c'è appena passato. Gratis, senza account.</p>
  <div class="bar">
    <div>
      <p class="label">Si apre dal browser, niente app da scaricare</p>
      <p class="domain black">quicarburanti.it</p>
    </div>
    <div class="arrow">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#1d1d1f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"/></svg>
    </div>
  </div>
</body>
</html>
