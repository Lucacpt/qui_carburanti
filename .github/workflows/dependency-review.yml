name: Dependency review

on:
  pull_request:

permissions: {}

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          # Licenze compatibili con la EUPL-1.2. MPL-2.0 e LGPL-3.0 servono solo per strumenti di
          # sviluppo (lightningcss via Vitest, sharp via Wrangler) che non finiscono nel bundle.
          # QUI non ha dipendenze runtime: ogni nuova dipendenza runtime va discussa nella PR.
          allow-licenses: MIT, ISC, BSD-2-Clause, BSD-3-Clause, Apache-2.0, 0BSD, CC0-1.0, BlueOak-1.0.0, MIT-0, Python-2.0, CC-BY-4.0, Unlicense, MPL-2.0, LGPL-3.0-or-later
          comment-summary-in-pr: on-failure
