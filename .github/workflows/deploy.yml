name: Deploy

# main → staging (staging.quicarburanti.it) + smoke test completo.
# tag v* → staging + smoke, poi produzione (quicarburanti.it) + smoke in sola lettura.
# "Run workflow" (manuale, da main) → solo staging + smoke.
# Procedura e configurazione una tantum: docs/procedure/rilascio.md
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

# Un deploy alla volta, mai interrotto a metà.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  staging:
    name: staging
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: staging
      url: https://staging.quicarburanti.it
    permissions:
      contents: read
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Nessuno script postinstall dalle dipendenze (supply chain, threat model P7).
      - run: npm ci --ignore-scripts
      # Un tag può puntare a un commit qualsiasi: i controlli si ripetono prima di pubblicare.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run privacy-guard
      - run: npm run budget

      - name: Deploy su staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/deploy.ts staging

      - name: Smoke test completo
        run: node scripts/smoke.ts https://staging.quicarburanti.it

  production:
    name: production
    needs: staging
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: https://quicarburanti.it
    permissions:
      contents: read
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Il tag corrisponde alla versione in package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          [ "$TAG" = "$VERSION" ] || { echo "Tag $TAG diverso da package.json ($VERSION)"; exit 1; }

      # In produzione niente segnaposto né avvisi di bozza nei documenti legali.
      - run: node scripts/check-legal.ts --strict

      - name: Deploy in produzione
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/deploy.ts production

      - name: Smoke test in sola lettura
        run: node scripts/smoke.ts https://quicarburanti.it --sola-lettura
